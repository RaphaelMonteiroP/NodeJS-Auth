services:
  db:
    image: postgres:18.0
    container_name: Node-Auth-DB
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORTS}:${PORTS}"
    volumes:
      - node-auth-db-data:/var/lib/postgresql
volumes:
  node-auth-db-data:
